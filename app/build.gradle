plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.baselineprofile'
}

android {
    namespace 'com.puretech.dialer'
    compileSdk 34

    defaultConfig {
        applicationId "com.puretech.dialer"
        minSdk 29
        targetSdk 34
        versionCode 228
        versionName "1.2.5"
    }

    // sign-rotate.ps1 builds "release" and signs it itself (apksigner re-signs
    // from scratch, so Gradle's own — absent — signingConfig here doesn't
    // matter). It must be this non-debuggable build type, not "debug": a
    // debuggable APK is always compiled interpret-only by the OS, ignoring any
    // baseline profile regardless of what's bundled, and separately the
    // baseline-profile/macrobenchmark tooling only auto-targets "release" by
    // default anyway.
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // Bypass Android's hidden-API blocklist so we can reflectively call MTK's
    // InCallService.doMtkAction(Bundle) for call recording on the F21.
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
    // Installs the generated baseline-prof.txt as an ART profile at startup so
    // the OS AOT-compiles the app's hot startup path instead of interpreting it.
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'
    baselineProfile project(':baselineprofile')
}
